name: build-dex

on:
  push:
    branches: [ main ]
    paths:
      - 'Hook.java'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TOOLS: 36.0.0
  PLATFORM: android-36
  PINE_VERSION: 0.3.0
  MIN_SDK: 28

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;${{ env.BUILD_TOOLS }} platforms;${{ env.PLATFORM }}'

      - name: Cache Pine AAR
        id: cache
        uses: actions/cache@v4
        with:
          path: build/pine.aar
          key: pine-${{ env.PINE_VERSION }}

      - name: Ambil & ekstrak Pine
        run: |
          set -euo pipefail
          if [ ! -f build/pine.aar ]; then
            mkdir -p build
            curl -fsSL -o build/pine.aar \
              "https://repo1.maven.org/maven2/top/canyie/pine/core/${PINE_VERSION}/core-${PINE_VERSION}.aar"
          fi
          mkdir -p build/pine
          unzip -qo build/pine.aar -d build/pine

      - name: Kompilasi Hook.java
        run: |
          set -euo pipefail
          mkdir -p build/classes
          javac -source 8 -target 8 -nowarn \
            -cp "build/pine/classes.jar:${ANDROID_HOME}/platforms/${PLATFORM}/android.jar" \
            -d build/classes Hook.java

      - name: Build dex dengan d8
        run: |
          set -euo pipefail
          mkdir -p out/lib/arm64-v8a
          "${ANDROID_HOME}/build-tools/${BUILD_TOOLS}/d8" \
            --lib "${ANDROID_HOME}/platforms/${PLATFORM}/android.jar" \
            --min-api "${MIN_SDK}" \
            --output build/dex \
            build/pine/classes.jar \
            $(find build/classes -name "*.class")
          cp build/dex/classes.dex out/classes6.dex
          cp build/pine/jni/arm64-v8a/libpine.so out/lib/arm64-v8a/

      - uses: actions/upload-artifact@v4
        with:
          name: aeel-dex
          path: out/
          if-no-files-found: error
          retention-days: 7
